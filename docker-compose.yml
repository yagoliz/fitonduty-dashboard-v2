services:
  fitonduty-dashboard-v2-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${POSTGRES_URL:-postgresql://fitonduty:fitonduty@db:5432/fitonduty}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
    restart: unless-stopped

  fitonduty-dashboard-v2-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - fitonduty-dashboard-v2-api
    restart: unless-stopped