version: '3.9'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://fitonduty:fitonduty@db:5432/fitonduty
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=true
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=fitonduty
      - POSTGRES_PASSWORD=fitonduty
      - POSTGRES_DB=fitonduty
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: